name: Build mod from zip

# Upload your add-on .zip to the ROOT of the repo (Add file -> Upload files).
# Every push that touches a .zip at the root builds it and gives you the jar.
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Unzip the newest zip in the repo root
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip found in the repo root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          GRADLE_FILE=$(find _src -maxdepth 3 -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then echo "No build.gradle inside the zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-dev.jar
